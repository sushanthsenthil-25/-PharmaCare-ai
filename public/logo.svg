<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="100%" height="100%" fill="none">
  <defs>
    <!-- Single curved half of the medical cross -->
    <path
      id="cross-ribbon-half"
      d="
        M 232 72
        C 255 72, 276 84, 276 116
        C 276 146, 292 165, 322 165
        C 354 165, 374 186, 374 215
        C 374 244, 354 265, 322 265
        C 292 265, 276 284, 276 314
        C 276 346, 255 358, 232 358
        C 214 358, 202 344, 218 326
      "
    />
  </defs>

  <!-- Outer Teal Ribbon Medical Cross with 180° Rotational Symmetry -->
  <g
    stroke="#1e898e"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <!-- Right & Top ribbon -->
    <use href="#cross-ribbon-half" />
    <!-- Left & Bottom ribbon (exact 180° rotation) -->
    <use href="#cross-ribbon-half" transform="rotate(180, 250, 215)" />
  </g>

  <!-- Inner AI Neural Network / Molecular Lattice (Royal Blue) -->
  <g
    stroke="#1a56bc"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#1a56bc"
  >
    <!-- Outer Facet Boundary Lines -->
    <line x1="250" y1="135" x2="295" y2="160" />
    <line x1="295" y1="160" x2="315" y2="215" />
    <line x1="315" y1="215" x2="295" y2="270" />
    <line x1="295" y1="270" x2="250" y2="295" />
    <line x1="250" y1="295" x2="205" y2="270" />
    <line x1="205" y1="270" x2="185" y2="215" />
    <line x1="185" y1="215" x2="205" y2="160" />
    <line x1="205" y1="160" x2="250" y2="135" />

    <!-- Outer to Inner Struts -->
    <line x1="250" y1="135" x2="250" y2="175" />
    <line x1="295" y1="160" x2="280" y2="190" />
    <line x1="315" y1="215" x2="285" y2="215" />
    <line x1="295" y1="270" x2="280" y2="240" />
    <line x1="250" y1="295" x2="250" y2="255" />
    <line x1="205" y1="270" x2="220" y2="240" />
    <line x1="185" y1="215" x2="215" y2="215" />
    <line x1="205" y1="160" x2="220" y2="190" />

    <!-- Inner Octagonal Ring Edges -->
    <line x1="250" y1="175" x2="280" y2="190" />
    <line x1="280" y1="190" x2="285" y2="215" />
    <line x1="285" y1="215" x2="280" y2="240" />
    <line x1="280" y1="240" x2="250" y2="255" />
    <line x1="250" y1="255" x2="220" y2="240" />
    <line x1="220" y1="240" x2="215" y2="215" />
    <line x1="215" y1="215" x2="220" y2="190" />
    <line x1="220" y1="190" x2="250" y2="175" />

    <!-- Cross Diagonal Bracing -->
    <line x1="220" y1="190" x2="280" y2="240" stroke-width="3" />
    <line x1="220" y1="240" x2="280" y2="190" stroke-width="3" />
    <line x1="250" y1="175" x2="250" y2="255" stroke-width="3" />
    <line x1="215" y1="215" x2="285" y2="215" stroke-width="3" />

    <!-- Center Hub Radiators -->
    <line x1="250" y1="215" x2="250" y2="175" stroke-width="5" />
    <line x1="250" y1="215" x2="280" y2="190" stroke-width="5" />
    <line x1="250" y1="215" x2="285" y2="215" stroke-width="5" />
    <line x1="250" y1="215" x2="280" y2="240" stroke-width="5" />
    <line x1="250" y1="215" x2="250" y2="255" stroke-width="5" />
    <line x1="250" y1="215" x2="220" y2="240" stroke-width="5" />
    <line x1="250" y1="215" x2="215" y2="215" stroke-width="5" />
    <line x1="250" y1="215" x2="220" y2="190" stroke-width="5" />

    <!-- Nodes -->
    <circle cx="250" cy="215" r="10" />
    <circle cx="250" cy="175" r="6.5" />
    <circle cx="280" cy="190" r="6.5" />
    <circle cx="285" cy="215" r="6.5" />
    <circle cx="280" cy="240" r="6.5" />
    <circle cx="250" cy="255" r="6.5" />
    <circle cx="220" cy="240" r="6.5" />
    <circle cx="215" cy="215" r="6.5" />
    <circle cx="220" cy="190" r="6.5" />

    <circle cx="250" cy="135" r="7.5" />
    <circle cx="295" cy="160" r="7.5" />
    <circle cx="315" cy="215" r="8.5" />
    <circle cx="295" cy="270" r="7.5" />
    <circle cx="250" cy="295" r="7.5" />
    <circle cx="205" cy="270" r="7.5" />
    <circle cx="185" cy="215" r="8.5" />
    <circle cx="205" cy="160" r="7.5" />
  </g>

  <!-- Typography: PHARMACARE AI -->
  <text x="250" y="445" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="4" fill="#3a2617">PHARMACARE</text>
  <text x="250" y="505" text-anchor="middle" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="36" letter-spacing="8" fill="#3a2617">AI</text>
</svg>
